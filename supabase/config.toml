project_id = "gtackixgmvfrxqelrato"
# Called by the database trigger (authenticated by the x-push-secret header)
# and by the app to fetch the public key, so it doesn't require a user JWT.
[functions.send-push]
verify_jwt = false

# Payments. Stripe calls the webhook (it checks the Stripe-Signature header
# itself); the other two need a signed-in member.
[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true

# AI step of "Fix a problem" — signed-in members only.
[functions.diagnose]
verify_jwt = true

# RevMate Store checkout — signed-in members only.
[functions.store-checkout]
verify_jwt = true
